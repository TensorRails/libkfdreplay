name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-notes.sh
      - Makefile
      - include/kfdreplay.h
      - CHANGELOG.md
      - RELEASING.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
      options: --init
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential linux-libc-dev git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version header and release notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          version=$(awk -F'"' '/^#define KFDR_VERSION_STRING / { print $2 }' include/kfdreplay.h)
          test -n "$version"
          if [ -n "$RELEASE_TAG" ] && [ "v$version" != "$RELEASE_TAG" ]; then
            echo "include/kfdreplay.h version ($version) does not match tag ($RELEASE_TAG)" >&2
            exit 1
          fi
          bash scripts/release-notes.sh "v$version" > /tmp/release-notes.md
      - name: Build and run unit tests
        run: |
          make clean
          make
          make test
      - name: Check GLIBC symbol baseline (<= GLIBC_2.34)
        run: |
          bad=$(objdump -T build/libkfdreplay.so | grep -Eo 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u |
            awk -F'[._]' '$2 > 2 || ($2 == 2 && $3 > 34)')
          if [ -n "$bad" ]; then
            echo "build/libkfdreplay.so requires newer GLIBC than 2.34: $bad" >&2
            exit 1
          fi
      - name: Package release assets
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}
        run: |
          stage="/tmp/stage/libkfdreplay-$TAG"
          mkdir -p "$stage/include" dist
          install -m 0755 build/libkfdreplay.so "$stage/libkfdreplay.so"
          install -m 0644 include/kfdreplay.h "$stage/include/kfdreplay.h"
          install -m 0644 LICENSE NOTICE README.md "$stage/"
          hdr_ver=$(awk -F'"' '/^#define KFDR_VERSION_STRING / { print $2 }' include/kfdreplay.h)
          printf 'release=%s\nversion=%s\ncommit=%s\nos=debian-12\narch=amd64\n' \
            "$TAG" "$hdr_ver" "$GITHUB_SHA" > "$stage/BUILDINFO"
          ldd --version | head -1 >> "$stage/BUILDINFO"
          cp -p "$stage/libkfdreplay.so" dist/libkfdreplay.so
          tar -czf "dist/libkfdreplay-$TAG-linux-amd64.tar.gz" -C /tmp/stage "libkfdreplay-$TAG"
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar.gz \
            --prefix="libkfdreplay-$TAG/" HEAD > "dist/libkfdreplay-$TAG-source.tar.gz"
          (cd dist && sha256sum libkfdreplay.so "libkfdreplay-$TAG-linux-amd64.tar.gz" "libkfdreplay-$TAG-source.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Verify checksums, exports and preload on ${{ matrix.os }}
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}
        run: |
          chmod 0755 assets/libkfdreplay.so
          (cd assets && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "assets/libkfdreplay-$TAG-linux-amd64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          pkg="$RUNNER_TEMP/unpacked/libkfdreplay-$TAG"
          cmp -s "$pkg/libkfdreplay.so" assets/libkfdreplay.so
          grep -Fqx "release=$TAG" "$pkg/BUILDINFO"
          sh tests/test_exports.sh "$pkg/libkfdreplay.so"
          gcc -O2 -std=gnu11 -Wall -Wextra -I"$pkg/include" -o "$RUNNER_TEMP/test_preload" tests/test_preload.c -ldl
          LD_PRELOAD="$pkg/libkfdreplay.so" "$RUNNER_TEMP/test_preload"
      - name: Verify packaged library under real DMTCP on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          scripts/install_dmtcp.sh "$RUNNER_TEMP/dmtcp"
          DMTCP_ROOT="$RUNNER_TEMP/dmtcp" KFDR_LIB="$PWD/assets/libkfdreplay.so" bash tests/test_cold_cycle.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" assets/* --verify-tag --title "libkfdreplay $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
